<!doctype html>
<html lang="zh-Hant-HK">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>JupaSearch - 香港升學課程資訊平台</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/manus-storage/favicon-192_2d4fbf68.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/manus-storage/favicon-512_7a63c25c.png" />
    <meta name="theme-color" content="#161e46" />

    <!-- Primary SEO -->
    <meta name="description" content="JupaSearch — 香港 JUPAS 升學課程資訊平台。查詢各大學課程資訊、比較收生成績、計算文憑試成績及模擬填寫 JUPAS 志願。" />
    <meta name="keywords" content="JUPAS, 香港升學, 課程查詢, 文憑試, DSE, 大學課程, 志願模擬, 成績計算, 香港大學, 港大, 科大, 城大, 理工, 浸江, 樹仁, 建投, 海浮, 嶺南, 海城, 港專" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="JupaSearch" />
    <link rel="canonical" href="https://jupasearch.manus.space/" />

    <!-- Open Graph -->
    <meta property="og:title" content="JupaSearch - 香港 JUPAS 升學課程資訊平台" />
    <meta property="og:description" content="JupaSearch — 查詢各大學課程資訊、比較收生成績、計算文憑試成績及模擬填寫 JUPAS 志願。" />
    <meta property="og:image" content="https://jupasearch.manus.space/manus-storage/favicon-512_7a63c25c.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jupasearch.manus.space/" />
    <meta property="og:locale" content="zh_HK" />
    <meta property="og:site_name" content="JupaSearch" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JupaSearch - 香港 JUPAS 升學課程資訊平台" />
    <meta name="twitter:description" content="JupaSearch — 查詢各大學課程資訊、比較收生成績、計算文憑試成績及模擬填寫 JUPAS 志願。" />
    <meta name="twitter:image" content="https://jupasearch.manus.space/manus-storage/favicon-512_7a63c25c.png" />

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JupaSearch",
      "alternateName": "香港升學課程資訊平台",
      "url": "https://jupasearch.manus.space/",
      "description": "JupaSearch — 香港 JUPAS 升學課程資訊平台，查詢各大學課程資訊、比較收生成績、計算文憑試成績及模擬填寫 JUPAS 志願。",
      "inLanguage": "zh-Hant-HK",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://jupasearch.manus.space/courses?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JupaSearch",
      "url": "https://jupasearch.manus.space/",
      "logo": "https://jupasearch.manus.space/manus-storage/favicon-512_7a63c25c.png",
      "description": "香港 JUPAS 升學課程資訊平台"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
